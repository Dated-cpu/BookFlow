<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="BookFlow AI — backend architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <circle cx="880" cy="120" r="220" fill="#22d3ee" opacity="0.06"/>
  <circle cx="120" cy="620" r="240" fill="#8b5cf6" opacity="0.07"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="60" y="88" font-size="12" font-weight="800" letter-spacing="0.18em" fill="#22d3ee">BACKEND · SQL · API</text>
    <text x="60" y="150" font-size="54" font-weight="800" letter-spacing="-0.05em" fill="#f3f8ff">BookFlow AI</text>
    <text x="60" y="184" font-size="18" fill="#9ab0c8">Scheduling &amp; appointment SaaS foundation</text>

    <g font-size="13" font-weight="600">
      <rect x="60" y="220" width="150" height="32" rx="16" fill="rgba(34,211,238,0.08)" stroke="#1d5a70"/>
      <text x="135" y="241" fill="#7dd3fc" text-anchor="middle">FastAPI</text>
      <rect x="222" y="220" width="150" height="32" rx="16" fill="rgba(139,92,246,0.08)" stroke="#4c3f8c"/>
      <text x="297" y="241" fill="#c4b5fd" text-anchor="middle">PostgreSQL</text>
      <rect x="384" y="220" width="170" height="32" rx="16" fill="rgba(52,211,153,0.07)" stroke="#225a49"/>
      <text x="469" y="241" fill="#6ee7b7" text-anchor="middle">SQLAlchemy 2</text>
      <rect x="566" y="220" width="170" height="32" rx="16" fill="rgba(251,191,36,0.07)" stroke="#6b5218"/>
      <text x="651" y="241" fill="#fcd34d" text-anchor="middle">Clean Architecture</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="60" y="300" width="880" height="300" rx="24" fill="#0b1422" stroke="#1b334d"/>
    </g>

    <!-- architecture flow -->
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">
      <rect x="90" y="336" width="170" height="86" rx="14" fill="#0e2233" stroke="#1f5570"/>
      <text x="175" y="369" fill="#7dd3fc" font-size="10" font-weight="800" text-anchor="middle">DOMAIN</text>
      <text x="175" y="390" fill="#dbeafe" text-anchor="middle">Entities · interfaces</text>
      <text x="175" y="407" fill="#6e819a" text-anchor="middle">zero framework deps</text>

      <rect x="300" y="336" width="170" height="86" rx="14" fill="#171530" stroke="#3d3470"/>
      <text x="385" y="369" fill="#c4b5fd" font-size="10" font-weight="800" text-anchor="middle">APPLICATION</text>
      <text x="385" y="390" fill="#dbeafe" text-anchor="middle">Use cases · DTO</text>
      <text x="385" y="407" fill="#6e819a" text-anchor="middle">repository ports</text>

      <rect x="510" y="336" width="180" height="86" rx="14" fill="#102a24" stroke="#1f6b53"/>
      <text x="600" y="369" fill="#6ee7b7" font-size="10" font-weight="800" text-anchor="middle">INFRASTRUCTURE</text>
      <text x="600" y="390" fill="#dbeafe" text-anchor="middle">Postgres · JWT · DI</text>
      <text x="600" y="407" fill="#6e819a" text-anchor="middle">async engine</text>

      <rect x="730" y="336" width="170" height="86" rx="14" fill="#2a2412" stroke="#7a6120"/>
      <text x="815" y="369" fill="#fcd34d" font-size="10" font-weight="800" text-anchor="middle">PRESENTATION</text>
      <text x="815" y="390" fill="#dbeafe" text-anchor="middle">FastAPI routers</text>
      <text x="815" y="407" fill="#6e819a" text-anchor="middle">schemas · validation</text>
    </g>

    <g stroke="url(#line)" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="260" y1="379" x2="296" y2="379"/>
      <line x1="470" y1="379" x2="506" y2="379"/>
      <line x1="690" y1="379" x2="726" y2="379"/>
    </g>

    <!-- database + terminal -->
    <g transform="translate(90 470)">
      <ellipse cx="50" cy="10" rx="44" ry="14" fill="#0c2a35" stroke="#1f6b7a"/>
      <path d="M6 10 V64 C6 78 94 78 94 64 V10" fill="#0b1f2a" stroke="#1f6b7a"/>
      <path d="M6 32 C6 46 94 46 94 32" fill="none" stroke="#1f6b7a" opacity="0.7"/>
      <path d="M6 48 C6 62 94 62 94 48" fill="none" stroke="#1f6b7a" opacity="0.5"/>
      <text x="50" y="96" fill="#6f93a8" font-size="10" font-weight="700" text-anchor="middle">PostgreSQL</text>
    </g>

    <g transform="translate(220 470)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect width="690" height="92" rx="12" fill="#070e18" stroke="#1a2c42"/>
      <text x="18" y="24" fill="#6e819a">$ make docker-up</text>
      <text x="18" y="44" fill="#6e819a">$ make migrate</text>
      <text x="18" y="64" fill="#22d3ee">✓ PostgreSQL ready · migrations applied</text>
      <text x="18" y="82" fill="#6ee7b7">✓ FastAPI · /docs · tests · Ruff · mypy</text>
    </g>

    <text x="60" y="650" fill="#6e819a" font-size="11">Domain → Application → Infrastructure → Presentation. Зависимости только внутрь.</text>
  </g>
</svg>
